<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- THURSDAY home-screen icon: "THU" over an Inland Empire sunset, the San Gabriels and a palm. The word mark stays inside the
       maskable safe circle (radius 205 about the centre). The letters use the menu font, Saira Stencil One (mkicon.js loads it). -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1830"/>
      <stop offset=".34" stop-color="#7a2f2a"/>
      <stop offset=".62" stop-color="#d8612a"/>
      <stop offset=".8" stop-color="#ffb23e"/>
      <stop offset="1" stop-color="#ffd27a"/>
    </linearGradient>
    <radialGradient id="sun" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset=".75" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#ffb23e"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="336" r="124" fill="url(#sun)"/>
  <!-- the San Gabriel Mountains: a far blue ridge and the near dark range -->
  <path d="M0 360 L48 330 L92 342 L150 300 L196 322 L238 290 L290 318 L336 296 L384 324 L440 302 L512 336 L512 420 L0 420 Z" fill="#6b3a4a"/>
  <path d="M0 392 L60 362 L104 374 L168 340 L222 366 L270 348 L320 370 L372 352 L430 376 L480 360 L512 372 L512 512 L0 512 Z" fill="#2a1a1c"/>
  <g fill="#15110c">
    <!-- tract roofs and a block wall along the bottom -->
    <rect x="0" y="430" width="512" height="82"/>
    <path d="M30 432 L76 404 L122 432 Z"/><path d="M118 434 L152 414 L186 434 Z"/><path d="M330 434 L368 410 L406 434 Z"/>
    <!-- a tall fan palm on the right -->
    <g transform="translate(470 440) scale(.82) translate(-437 -440)">
    <path d="M430 440 C432 380 426 300 414 236 L424 234 C438 298 446 380 444 440 Z"/>
    <path d="M419 236 C396 212 364 208 340 226 C366 222 394 228 416 244 Z"/>
    <path d="M419 236 C410 204 386 186 358 184 C382 196 402 214 414 240 Z"/>
    <path d="M419 236 C424 202 446 184 474 182 C452 196 434 214 424 242 Z"/>
    <path d="M419 236 C444 214 474 214 498 232 C470 228 444 234 422 246 Z"/>
    <path d="M419 236 C440 240 462 256 474 280 C454 264 434 254 416 250 Z"/>
    <path d="M419 236 C400 242 380 258 370 282 C388 266 404 256 420 250 Z"/>
    </g>
  </g>
  <!-- word mark -->
  <g font-family="'Saira Stencil One','Impact','Arial Black',sans-serif" font-size="162" text-anchor="middle" letter-spacing="4">
    <text x="261" y="275" fill="#15110c">THU</text>
    <text x="256" y="268" fill="#f3e8d3">THU</text>
  </g>
  <rect x="166" y="298" width="190" height="12" fill="#15110c"/>
  <rect x="161" y="292" width="190" height="12" fill="#f3e8d3"/>
</svg>
